name: cinetpay_flutter
description: >
  Flutter SDK for CinetPay payments. Opens the CinetPay checkout page in a
  WebView and reports the payment result back to your app. The payment must be
  initialized on your backend first — this SDK only handles the frontend flow.
version: 1.0.0
homepage: https://cinetpay.com
repository: https://github.com/cinetpay/cinetpay-flutter
issue_tracker: https://github.com/cinetpay/cinetpay-flutter/issues
documentation: https://docs.cinetpay.com

environment:
  sdk: ^3.0.0
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  webview_flutter: ^4.10.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
